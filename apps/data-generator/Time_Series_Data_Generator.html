<style>
/* Glass theme of the ARIMA / SARIMA / TF dashboards (Apple-inspired translucency, SF / Inter typography,
   pill controls), rewritten for a standalone page without Bootstrap. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter Variable", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Variable", "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #f5f5f7; --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --accent: #0071e3; --link: #0066cc;
  --glass: rgba(255, 255, 255, .62); --glass-2: rgba(255, 255, 255, .80); --glass-3: rgba(255, 255, 255, .93); --glass-edge: rgba(255, 255, 255, .75);
  --hair: rgba(0, 0, 0, .08); --fill: rgba(0, 0, 0, .045); --fill-2: rgba(0, 0, 0, .08);
  --sh-1: 0 1px 1px rgba(0, 0, 0, .03), 0 8px 24px rgba(0, 0, 0, .05);
  --sh-2: 0 2px 8px rgba(0, 0, 0, .05), 0 26px 70px rgba(0, 0, 0, .12);
  --blur: saturate(180%) blur(22px);
  --ok-ink: #0a7a3d; --ok-bg: rgba(52, 199, 89, .13); --warn-ink: #9a4400; --warn-bg: rgba(255, 149, 0, .14); --bad-ink: #c4410c; --bad-bg: rgba(255, 59, 48, .10);
  --r-card: 22px; --nav-top: 10px; --nav-h: 58px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--nav-h) + 80px); }
body { margin: 0; min-height: 100vh; font-family: var(--font-ui); font-size: 15px; line-height: 1.45; color: var(--ink); background: transparent; letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42vmax 34vmax at 6% -4%, rgba(0, 113, 227, .16), transparent 70%),
    radial-gradient(38vmax 30vmax at 100% 8%, rgba(48, 176, 199, .14), transparent 70%),
    radial-gradient(46vmax 36vmax at 82% 104%, rgba(255, 159, 10, .10), transparent 70%),
    radial-gradient(40vmax 34vmax at 0% 92%, rgba(175, 82, 222, .08), transparent 70%),
    linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 46%, #f2f2f5 100%); }
body > * { position: relative; z-index: 1; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.022em; color: var(--ink); }
a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
::selection { background: rgba(0, 113, 227, .2); }
code { font-family: var(--font-mono); color: #3a3a3c; background: rgba(0, 0, 0, .055); padding: .08em .35em; border-radius: 6px; font-size: .86em; }
button { font: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(0, 113, 227, .25) !important; border-radius: 10px; }

/* ---------- floating glass navigation ---------- */
.navbar { position: sticky; top: var(--nav-top); z-index: 50; display: flex; align-items: center; gap: 8px; min-height: var(--nav-h);
  margin: var(--nav-top) 14px 6px; padding: 5px 8px 5px 12px; border-radius: 20px; border: 1px solid var(--glass-edge);
  background: rgba(255, 255, 255, .86); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--sh-1); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: none; }
.brand-logos { display: flex; align-items: center; gap: 8px; }
.brand-logos img { height: 32px; width: auto; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
.brand-title { font-family: var(--font-display); font-size: 15.5px; font-weight: 650; letter-spacing: -0.025em; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.nav-links { display: flex; gap: 2px; margin: 0 auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links button { border: 0; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: background .2s ease; }
.nav-links button:hover { background: var(--fill); }
.nav-links button[aria-current="page"] { background: var(--fill-2); font-weight: 600; }
.lang-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); flex: none; }
.lang-btn { border: 0; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: transparent; cursor: pointer; transition: background .2s ease, color .2s ease; }
.lang-btn:hover { color: var(--ink); }
.lang-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 1px 1px rgba(0, 0, 0, .06); }

/* ---------- page layout ---------- */
.wrap { max-width: 1720px; margin: 0 auto; padding: 8px 18px 0; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
.side { position: sticky; top: calc(var(--nav-top) + var(--nav-h) + 16px); max-height: calc(100vh - var(--nav-top) - var(--nav-h) - 30px); overflow: auto;
  border-radius: var(--r-card); border: 1px solid var(--glass-edge); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--sh-1); padding: 16px 16px 18px; scrollbar-width: thin; overscroll-behavior: contain; }
.side-toggle { display: none; width: 100%; align-items: center; justify-content: space-between; border: 0; background: transparent; padding: 2px 0 10px; font-family: var(--font-display);
  font-size: 16px; font-weight: 650; color: var(--ink); cursor: pointer; }
.side-toggle::after { content: "\203A"; font-size: 22px; transform: rotate(90deg); transition: transform .2s ease; color: var(--ink-2); }
.side.collapsed .side-toggle::after { transform: rotate(0deg); }
.side-sec + .side-sec { border-top: 1px solid var(--hair); margin-top: 14px; padding-top: 14px; }
.side-head { font-size: 15px; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 10px; }
.sub-head { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 10px 0 8px; }
.fld { display: block; margin: 0 0 11px; min-width: 0; }
.fl { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
.fl .hint { color: var(--ink-3); font-weight: 400; }
.fld input[type=number] { width: 100%; min-height: 36px; border-radius: 10px; border: 1px solid var(--hair); background: rgba(255, 255, 255, .92); color: var(--ink);
  padding: 6px 10px; font-size: 14px; font-variant-numeric: tabular-nums; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .03); }
.fld input[type=number]:focus { outline: none; border-color: rgba(0, 113, 227, .6); box-shadow: 0 0 0 3px rgba(0, 113, 227, .18); }
.fld input.bad { border-color: rgba(196, 65, 12, .7); background: #fff7f3; }
.fld input:disabled { opacity: .5; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.grid3, .pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 13px; background: var(--fill); max-width: 100%; }
.seg button { border: 0; background: transparent; min-width: 32px; padding: 5px 10px; border-radius: 10px; color: var(--ink-2); font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: background .2s ease, color .2s ease; font-variant-numeric: tabular-nums; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .13), 0 1px 1px rgba(0, 0, 0, .05); }
.seg.wide { display: flex; } .seg.wide button { flex: 1 1 0; min-width: 0; line-height: 1.25; }
.grid2 .seg button, .grid3 .seg button, .inp-body .seg button { min-width: 26px; padding: 5px 7px; }
.switch { display: flex; align-items: center; gap: 11px; font-size: 13.5px; margin: 2px 0 12px; cursor: pointer; line-height: 1.3; }
.switch input { -webkit-appearance: none; appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 999px; cursor: pointer;
  background: radial-gradient(circle at 13px 50%, #fff 0, #fff 10.6px, rgba(0, 0, 0, .14) 11.4px, transparent 12.6px), rgba(120, 120, 128, .24); transition: background .25s ease; }
.switch input:checked { background: radial-gradient(circle at calc(100% - 13px) 50%, #fff 0, #fff 10.6px, rgba(0, 0, 0, .14) 11.4px, transparent 12.6px), #34c759; }
.switch.dis { opacity: .5; cursor: default; }
.seed-row { display: flex; gap: 6px; }
.seed-row input { flex: 1; min-width: 0; }
.icon-btn { flex: none; width: 38px; min-height: 36px; border-radius: 10px; border: 1px solid var(--hair); background: rgba(255, 255, 255, .92); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: transform .12s ease, background .2s ease; }
.icon-btn:hover { background: #fff; box-shadow: var(--sh-1); }
.icon-btn:active { transform: scale(.95); }
.cfg-status > div { border-radius: 12px; padding: 8px 11px; font-size: 13px; margin-top: 8px; line-height: 1.4; }
.cfg-status .ok { background: var(--ok-bg); color: var(--ok-ink); }
.cfg-status .warn { background: var(--warn-bg); color: var(--warn-ink); }
.cfg-status .bad { background: var(--bad-bg); color: var(--bad-ink); }
details.inp { border: 1px solid var(--hair); border-radius: 14px; background: rgba(255, 255, 255, .55); margin: 10px 0 0; }
details.inp > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; align-items: baseline; gap: 10px; }
details.inp > summary::-webkit-details-marker { display: none; }
details.inp > summary::after { content: "\203A"; margin-left: auto; color: var(--ink-3); transition: transform .2s ease; }
details.inp[open] > summary::after { transform: rotate(90deg); }
.inp-name { font-weight: 650; font-family: var(--font-display); }
.inp-meta { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.inp-body { padding: 0 12px 4px; }

/* ---------- main column ---------- */
.main { min-width: 0; }
.tabbar { position: sticky; top: calc(var(--nav-top) + var(--nav-h) + 10px); z-index: 20; display: flex; gap: 2px; padding: 4px; overflow-x: auto; margin-bottom: 14px;
  border: 1px solid var(--glass-edge); border-radius: 999px; background: rgba(255, 255, 255, .86); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--sh-1);
  scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { flex: none; white-space: nowrap; border: 0; border-radius: 999px; padding: 7px 15px; color: var(--ink-2); font-size: 14px; font-weight: 500; background: transparent; cursor: pointer;
  transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
.tabbar button:hover { color: var(--ink); }
.tabbar button[aria-selected="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .13), 0 1px 1px rgba(0, 0, 0, .05); }
.headline { margin: 2px 2px 16px; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: #6e6e73; margin-bottom: 4px; }
.headline h1 { font-size: clamp(28px, 3.2vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.06; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.headline h1 sub { font-size: .55em; vertical-align: -0.25em; letter-spacing: 0; }
.headline .sub { font-size: 16px; color: var(--ink-2); line-height: 1.6; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; vertical-align: 1px; margin: 0 0 0 6px; white-space: nowrap; }
.chip.ok { background: rgba(52, 199, 89, .14); color: #1d7a3a; }
.chip.warn { background: rgba(255, 149, 0, .16); color: #9a5b00; }
.chip.bad { background: rgba(255, 59, 48, .12); color: var(--bad-ink); }
.chip.busy { background: rgba(0, 113, 227, .10); color: #0062c4; }
.spin { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cards, grid, facts ---------- */
.card { background: var(--glass-2); border: 1px solid var(--glass-edge); border-radius: var(--r-card); box-shadow: var(--sh-1); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  overflow: hidden; margin: 0 0 16px; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--hair); }
.card-h .ttl { flex: 1; min-width: 0; margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.3; }
.card-b { padding: 14px 18px 16px; }
.card-f { border-top: 1px solid var(--hair); color: var(--ink-2); font-size: 13px; padding: 10px 18px; line-height: 1.5; }
.tools { display: flex; gap: 4px; flex: none; }
.mini { border: 1px solid var(--hair); background: rgba(255, 255, 255, .75); color: var(--ink-2); border-radius: 999px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; cursor: pointer;
  letter-spacing: .02em; transition: background .2s ease, color .2s ease; }
.mini:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.grid > * > .card { margin: 0; height: 100%; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 16px; }
.fact { border: 1px solid var(--glass-edge); border-radius: 18px; background: var(--glass-2); box-shadow: var(--sh-1); padding: 13px 16px; min-width: 0; }
.fact .num { font-family: var(--font-display); font-size: clamp(20px, 1.9vw, 27px); font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact .lbl { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.sec-title { font-size: 20px; font-weight: 650; margin: 22px 2px 12px; }
.sec-title:first-child { margin-top: 4px; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; font-family: var(--font-ui); overflow: visible; }
.tip { position: absolute; display: none; pointer-events: none; z-index: 30; background: rgba(29, 29, 31, .9); color: #fff; font-size: 12px; line-height: 1.45; padding: 6px 10px;
  border-radius: 10px; box-shadow: var(--sh-2); white-space: nowrap; font-variant-numeric: tabular-nums; transform: translate(-50%, calc(-100% - 12px)); }
.tip-h { color: rgba(255, 255, 255, .7); font-size: 11.5px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.plot-err { color: var(--bad-ink); font-size: 13px; padding: 12px 0; }

/* ---------- tables ---------- */
.table-wrap { border-radius: 14px; border: 1px solid var(--hair); background: rgba(255, 255, 255, .72); overflow: auto; -webkit-overflow-scrolling: touch; }
.table-wrap.tall { max-height: 420px; }

table.metric th { position: sticky; top: 0; z-index: 1; background: #f1f1f3; color: #48484a; font-weight: 600; font-size: 13px; text-align: right; padding: 8px 10px;
  border-bottom: 1px solid var(--hair); white-space: nowrap; }
table.metric td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--hair); white-space: nowrap; }

table.metric td.insig { color: var(--bad-ink); }
table.metric td.muted { color: var(--ink-3); }
.yes { color: var(--ok-ink); font-weight: 700; } .no { color: var(--bad-ink); font-weight: 700; } .mixed { color: #9a5b00; font-weight: 600; }

/* ---------- equations (MathML) ---------- */
math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", "Times New Roman", math; }
.eqs { display: grid; gap: 8px; }
.eq-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; border: 1px solid var(--hair); border-radius: 12px; background: rgba(255, 255, 255, .66);
  padding: 7px 8px 8px 12px; }
.eq-cap { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.eq { overflow-x: auto; overflow-y: hidden; padding: 2px 0; scrollbar-width: thin; }
.eq math { font-size: 1.14em; }
.card-h math, table.metric math, .fl math { font-size: 1.08em; }
.copy-tex { border: 1px solid var(--hair); background: #fff; border-radius: 999px; font-size: 11px; font-weight: 650; color: var(--ink-2); padding: 3px 8px; cursor: pointer; }
.copy-tex:hover { color: var(--accent); border-color: rgba(0, 113, 227, .4); }
.copy-tex.done, .btn.done { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }

/* ---------- buttons, notes, code ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(0, 113, 227, .35); background: rgba(255, 255, 255, .75); color: var(--accent);
  font-size: 14px; font-weight: 500; padding: 7px 15px; cursor: pointer; transition: transform .12s ease, background .2s ease, color .2s ease; }
.btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:active { transform: scale(.975); }
.btn.ghost { border-color: var(--hair); color: var(--ink); }
.btn.ghost:hover { background: #fff; color: var(--ink); box-shadow: var(--sh-1); }
.dl-row, .code-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.note { color: var(--ink-2); font-size: 13px; margin: 10px 2px 0; line-height: 1.5; }
.verdict { border-radius: 14px; padding: 10px 14px; line-height: 1.5; }
.verdict.ok { background: var(--ok-bg); color: var(--ok-ink); } .verdict.warn { background: var(--warn-bg); color: var(--warn-ink); }
.verdict.bad { background: var(--bad-bg); color: var(--bad-ink); }
.busy-row { display: flex; align-items: center; gap: 10px; color: #0062c4; padding: 6px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0 0 10px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
pre.code { margin: 0; padding: 14px 16px; border-radius: 12px; background: #fbfbfd; border: 1px solid var(--hair); overflow: auto; font-family: var(--font-mono); font-size: 12.6px;
  line-height: 1.55; max-height: 640px; white-space: pre; tab-size: 2; }
pre.code .cm { color: #6e6e73; font-style: italic; }
pre.code .st { color: #a0410d; }

/* ---------- footer ---------- */
.app-footer { display: flex; align-items: center; justify-content: center; gap: 18px; width: fit-content; max-width: calc(100% - 24px); margin: 40px auto 28px; padding: 16px 26px;
  color: var(--ink-2); background: rgba(255, 255, 255, .94); border: 1px solid var(--glass-edge); border-radius: 22px; box-shadow: var(--sh-1); }
.footer-logos { display: flex; gap: 12px; flex: none; }
.footer-logos img { height: 40px; width: auto; display: block; }
.footer-text { text-align: left; line-height: 1.4; }
.footer-dept { color: var(--ink); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
.footer-sub { font-size: 13px; margin-top: 2px; }

/* ---------- small screens ---------- */
@media (max-width: 1180px) { .c3, .c4 { grid-column: span 6; } }
@media (max-width: 991.98px) {
  :root { --nav-top: 8px; --nav-h: 52px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; overflow: visible; }
  .side-toggle { display: flex; }
  .side.collapsed .side-body { display: none; }
  .tabbar { position: static; border-radius: 16px; }
  .navbar { margin: 8px 8px 6px; border-radius: 18px; }
}
@media (max-width: 860px) {
  .navbar { flex-wrap: wrap; }
  .nav-links { order: 3; width: 100%; margin: 2px 0 0; overflow-x: auto; }
  .brand-sub { display: none; }
  .brand-title { font-size: 14.5px; white-space: normal; }
  .lang-switch { margin-left: auto; }
}
@media (max-width: 760px) {
  .wrap { padding: 6px 10px 0; }
  .grid > * { grid-column: 1 / -1 !important; }
  .card, .fact, .side { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 255, 255, .92); }
  .card { border-radius: 18px; }
  .card-h { padding: 11px 12px 11px 14px; } .card-b { padding: 12px 14px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  table.metric th, table.metric td { font-size: 13px; padding: 6px 8px; }
  .app-footer { flex-direction: column; width: auto; margin: 32px 6px 20px; padding: 18px 16px; gap: 10px; }
  .app-footer .footer-text { text-align: center; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .navbar, .tabbar, .card, .side { background: rgba(255, 255, 255, .96); }
}

const ENGINE_SRC = (document.getElementById('engine-src') || {}).textContent || '';
const WORKER_GLUE = "\nself.onmessage=function(e){var d=e.data,o;try{o=d.kind==='tf'?TSE.jobTF(d.payload):TSE.jobSarima(d.payload);}catch(err){o={error:(err&&err.message)||String(err)};}self.postMessage({id:d.id,out:o});};";

  const local = () => setTimeout(() => { if (id !== P.jobSeq) return; let o; try { o = kind === 'tf' ? TSE.jobTF(payload) : TSE.jobSarima(payload); } catch (e) { o = { error: (e && e.message) || String(e) }; } done(o); }, 30);

    R.push(['model', orderText(c, z, s)], ['n', c.n], ['seed', c.seed]); if (z) R.push(['s', s]);
    c.phi.forEach((v, k) => R.push([`phi_${k + 1}`, v])); c.theta.forEach((v, k) => R.push([`theta_${k + 1}`, sg * v])); Phi.forEach((v, k) => R.push([`Phi_${k + 1}`, v])); Theta.forEach((v, k) => R.push([`Theta_${k + 1}`, sg * v]));
    R.push(['mu (mean of the stationary part)', c.mu], ['sigma', c.sigma]); if (c.d + (z ? c.D : 0)) R.push(['y0 (starting level)', c.y0]);
  }
  R.push(['sign convention', conv], ['generator', 'Time Series Data Generator: same draws as set.seed() + arima.sim() in R'], ['created', new Date().toISOString()]);
  return R;
}
function estRows(P) {
  const E = P.est; if (!E || !E.ok) return null;
  const rows = P.kind === 'tf' ? coefRowsTF(P) : coefRowsS(P), R = [['parameter', 'R name', 'true', 'estimate', 'se', 'z', 'p', 'ci_low', 'ci_high', 'ci_covers_true']];
  rows.forEach(r => R.push([r.lab, r.nm, r.tru, r.est, r.se, r.z, r.p, r.lo, r.hi, r.cover === null ? '' : r.cover ? 'yes' : 'no']));
  R.push([], ['sigma2', E.sigma2], ['loglik', E.loglik], ['AIC', E.aic], ['BIC', E.bic], ['method', P.kind === 'tf' ? 'ML (TSA::arimax)' : E.method + ' (forecast::Arima)']);
  return R;
}
function downloadXLSX(P) {
  const cols = dataCols(P), n = cols[0].v.length, rows = [cols.map(c => c.h)];
  for (let i = 0; i < n; i++) rows.push(cols.map(c => c.v[i]));
  const sheets = [{ name: 'data', rows, opt: { freeze: true, width: 12 } }, { name: 'model', rows: modelRows(P), opt: { width: 34 } }], er = estRows(P);
  if (er) sheets.push({ name: 'estimates', rows: er, opt: { freeze: true, width: 14 } });
  saveBlob(fileBase(P) + '.xlsx', new Blob([xlsxBytes(sheets)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

/* ---------------- frame, navigation, language ---------------- */
const NAV = [['arima', 'ARIMA', 'ARIMA'], ['sarima', 'Seasonal ARIMA', 'ARIMA musiman'], ['tf', 'Transfer function', 'Fungsi transfer']];
function renderChrome() {
  $('#nav-links').innerHTML = NAV.map(([id, en, idn]) => `<button type="button" data-page="${id}" aria-current="${APP.page === id ? 'page' : 'false'}">${T(en, idn)}</button>`).join('');
  $('#brand-sub').textContent = T('Time Series Analysis & Econometrics', 'Analisis dan Ekonometrika Deret Waktu');
  $('#foot-dept').textContent = T('Department of Statistics, Institut Teknologi Sepuluh Nopember (ITS), Surabaya', 'Departemen Statistika, Institut Teknologi Sepuluh Nopember (ITS), Surabaya');
  $('#foot-sub').textContent = T('Time Series Data Generator · ARIMA, seasonal ARIMA and transfer function models · runs offline in the browser', 'Time Series Data Generator · model ARIMA, ARIMA musiman, dan fungsi transfer · berjalan offline di browser');
  $$('.lang-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === APP.lang)));
}
function renderPage(P) {
  $('#page').innerHTML = `<div class="layout"><aside class="side" id="side" aria-label="${T('Model settings', 'Pengaturan model')}"></aside><section class="main"><div class="tabbar" role="tablist" id="tabbar"></div><header class="headline" id="headline" aria-live="polite"></header><div id="pane"></div></section></div>`;
  renderSide(P); renderTabbar(P); renderHeadline(P); renderPane(P); bindPage(P);
}
function showPage(id) {
  if (!APP.pages[id]) id = 'arima';
  APP.page = id; const P = APP.pages[id];
  $$('[data-page]').forEach(b => b.setAttribute('aria-current', b.dataset.page === id ? 'page' : 'false'));
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// may refuse */ }
  renderPage(P);
  if (!P.sim && !(P.status && P.status.fatal)) gen(P);
}
function setLang(l) { APP.lang = l; document.documentElement.lang = l; try { localStorage.setItem('tsgen-lang', l); } catch (e) { /* ignore */ } renderChrome(); renderPage(APP.pages[APP.page]); }
function setTab(tab) { const P = APP.pages[APP.page]; P.tab = tab; renderTabbar(P); renderPane(P); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const P = APP.pages[APP.page];
  if (b.dataset.page) showPage(b.dataset.page);
  else if (b.classList.contains('lang-btn')) setLang(b.dataset.lang);
  else if (b.dataset.tab) setTab(b.dataset.tab);
  else if (b.dataset.dl) exportChart(b.dataset.c, b.dataset.dl, b.dataset.f);
  else if (b.classList.contains('copy-tex')) copyText(b.dataset.copy, b);
  else if (b.dataset.act === 'dice') { P.cfg.seed = 1 + Math.floor(Math.random() * 999999); const inp = $('[data-k="seed"]'); if (inp) inp.value = P.cfg.seed; gen(P); }
  else if (b.dataset.act === 'csv') saveBlob(fileBase(P) + '.csv', new Blob([csvString(dataCols(P))], { type: 'text/csv;charset=utf-8' }));
  else if (b.dataset.act === 'xlsx') downloadXLSX(P);
  else if (b.dataset.act === 'copy-code') copyText(P.rsrc || '', b);
  else if (b.dataset.act === 'force-ml') { P.forceML = true; startEst(P); }
  else if (b.dataset.act === 'dl-code') saveBlob(fileBase(P) + '.R', new Blob([P.rsrc || ''], { type: 'text/plain;charset=utf-8' }));
});
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const P = APP.pages[APP.page]; (P.drawers || []).forEach(([id, fn]) => { const el = document.getElementById(id); if (el) { try { fn(el); } catch (e) { /* ignore */ } } }); }, 160); });
PAGE_IDS.forEach(id => { APP.pages[id] = mkPage(id); normalize(APP.pages[id]); });
document.documentElement.lang = APP.lang;
renderChrome();
showPage((location.hash || '').replace('#', ''));
window.TSGEN = { APP, gen, setTab, showPage };
})();

</script>
